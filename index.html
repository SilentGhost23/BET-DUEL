const fmt=c=>c.replace(/(.{4})(?=.)/g,'$1-');
let chans=[],me,opp,B,bets=[],chs=[],games=[],day=0,sel=null,per='week',hf='all',picks=[],stakes=[],results=[],pays=[],dr={mvp:[],roy:[]},damt={mvp:500,roy:500},aw=null,am='pick',aq='',NBA=[],subbed=false;

// ---------- onboarding ----------
function welcome(){
 let L=[];try{L=JSON.parse(localStorage.bd_list||'[]')}catch(e){}
 const bl=L.length?`<div class="card"><p class="lbl">My battles</p><div style="display:flex;flex-direction:column;gap:8px">${L.map(x=>`<button class="row" style="border:0;color:#e9ecf1;cursor:pointer;min-height:44px;width:100%;text-align:left" onclick="switchTo('${x.code}')"><span style="font-weight:600">${esc(x.label)}</span><span class="mut">Open</span></button>`).join('')}</div></div>`:'';
 const j=new URLSearchParams(location.search).get('join');
 A.innerHTML=`<div class="num" style="font-size:32px;letter-spacing:.04em">BET DUEL</div>`+
 (j?`<div class="card"><p class="lbl">Join battle</p><input id="pn" placeholder="Your name"><button class="btn" style="width:100%;background:#3aa0ff;color:#001a33" onclick="joinB('${esc(j)}')">Join battle</button></div>`
 :`<div class="card"><p class="lbl">Create battle</p><input id="pn" placeholder="Your name"><input id="bn" placeholder="Battle name (e.g. Barkada Cup)"><input id="se" value="2026-27"><button class="btn" style="width:100%;background:#ff7a2f;color:#1a0b00" onclick="createB()">Create &amp; get invite link</button></div>`)+
 `<div class="card"><p class="lbl">Have a sync code?</p><input id="sc" placeholder="XXXX-XXXX-XXXX"><button class="btn" style="width:100%;background:#262b35;color:#e9ecf1" onclick="useCode()">Restore</button></div>`+bl;
}
async function createB(){
 const n=$('#pn').value.trim(),bn=$('#bn').value.trim(),se=$('#se').value.trim();
 if(!n||!bn||!se)return alert('Fill in all fields');
 const {data:b,error}=await sb.from('battles').insert({name:bn,season:se,invite_code:gen(6)}).select().single();
 if(error)return alert(error.message);
 const {data:p,error:e2}=await sb.from('players').insert({battle_id:b.id,slot:1,name:n,color:'orange',sync_code:gen(12)}).select().single();
 if(e2)return alert(e2.message);
 localStorage.bd_sync=p.sync_code;await boot();alert('Save your sync code (see bottom of page) and send the invite link to Player 2.');
}
async function joinB(code){
 const n=$('#pn').value.trim();if(!n)return alert('Enter your name');
 const {data:b}=await sb.from('battles').select('*').eq('invite_code',code.toUpperCase()).maybeSingle();
 if(!b)return alert('Invalid invite link');
 const {data:ps}=await sb.from('players').select('id').eq('battle_id',b.id);
 if(ps.length>=2)return alert('This battle already has 2 players');
 const {data:p,error}=await sb.from('players').insert({battle_id:b.id,slot:2,name:n,color:'blue',sync_code:gen(12)}).select().single();
 if(error)return alert(error.message);
 localStorage.bd_sync=p.sync_code;history.replaceState(null,'',location.pathname);await boot();
}
function newBattle(){localStorage.removeItem('bd_sync');sel=null;aw=null;dr={mvp:[],roy:[]};me=null;welcome()}
async function switchTo(code){localStorage.bd_sync=code;sel=null;aw=null;dr={mvp:[],roy:[]};picks=[];bets=[];chs=[];stakes=[];results=[];pays=[];await boot()}
async function useCode(){localStorage.bd_sync=$('#sc').value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();await boot()}

// ---------- data ----------
async function boot(){
 const sc=localStorage.bd_sync;if(!sc)return welcome();
 const {data:p}=await sb.from('players').select('*').eq('sync_code',sc).maybeSingle();
 if(!p){localStorage.removeItem('bd_sync');alert('Sync code not found');return welcome()}
 me=p;
 const {data:b}=await sb.from('battles').select('*').eq('id',p.battle_id).single();B=b;
 try{const L=JSON.parse(localStorage.bd_list||'[]').filter(x=>x.code!==sc);L.unshift({code:sc,label:B.name+' · '+B.season});localStorage.bd_list=JSON.stringify(L.slice(0,20))}catch(e){}
 await load();await loadGames();
 chans.forEach(c=>sb.removeChannel(c));
 chans=['challenges','bets','award_picks','award_stakes','award_results','award_payouts'].map(t=>sb.channel('bd_'+t+'_'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:t,filter:'battle_id=eq.'+B.id},()=>load()).subscribe());
 if(fxCh)sb.removeChannel(fxCh);
 fxCh=sb.channel('fx_'+B.id,{config:{broadcast:{self:false}}}).on('broadcast',{event:'fx'},m=>{const p=m.payload;if(p&&me&&p.to===me.id)playFx(p.fx)}).subscribe();
 if(!subbed){subbed=true;setInterval(settle,60000);setInterval(loadGames,60000)}
 settle();
}
async function load(){
 const {data:ps}=await sb.from('players').select('*').eq('battle_id',B.id);
 opp=ps.find(x=>x.id!==me.id);
 const [b,c,pk,st,rs,py]=await Promise.all([sb.from('bets').select('*').eq('battle_id',B.id),sb.from('challenges').select('*').eq('battle_id',B.id).order('created_at',{ascending:false}),sb.from('award_picks').select('*').eq('battle_id',B.id),sb.from('award_stakes').select('*').eq('battle_id',B.id),sb.from('award_results').select('*').eq('battle_id',B.id),sb.from('award_payouts').select('*').eq('battle_id',B.id)]);
 bets=b.data||[];chs=c.data||[];picks=pk.data||[];stakes=st.data||[];results=rs.data||[];pays=py.data||[];view();
}
async function loadGames(){
 try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates='+dkey(day)).then(r=>r.json());
 games=(r.events||[]).map(e=>{const c=e.competitions[0].competitors,h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');
  return{id:e.id,date:e.date,state:e.status.type.state,detail:e.status.type.shortDetail,h:h.team.abbreviation,a:a.team.abbreviation,hs:h.score,as:a.score}});
 }catch(e){games=[]}
 view();
}
async function settle(){
 const open=bets.filter(b=>b.status==='open');
 for(const id of [...new Set(open.map(b=>b.game_id))]){
  try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event='+id).then(r=>r.json());
   const c=r.header.competitions[0];if(!c.status.type.completed)continue;
   const w=c.competitors.find(x=>x.winner);if(!w)continue;
   for(const b of open.filter(x=>x.game_id===id)){const won=b.team===w.team.abbreviation;
    await sb.from('bets').update({status:won?'won':'lost',profit:won?b.amount:-b.amount,settled_at:new Date().toISOString()}).eq('id',b.id).eq('status','open');}
  }catch(e){}
 }
 if(open.length)load();
}

// ---------- actions ----------
function pick(id){sel=sel&&sel.id===id?null:{id,team:null,amt:500};view()}
function setTeam(t){sel.team=t;view()}
function setAmt(n){sel.amt=n;view()}
async function send(){
 const g=games.find(x=>x.id===sel.id),amt=Number($('#amt').value);
 if(!opp)return alert('Wait for Player 2 to join first');
 if(chs.some(c=>c.game_id===g.id&&c.status!=='rejected'))return alert('This game already has a challenge');
 if(!sel.team)return alert('Select a team');if(!(amt>0))return alert('Enter an amount');
 const {error}=await sb.from('challenges').insert({battle_id:B.id,game_id:g.id,game_date:g.date,home_team:g.h,away_team:g.a,from_player:me.id,to_player:opp.id,from_team:sel.team,amount:amt});
 if(error)return alert(error.message);
 sel=null;alert('Request sent to '+opp.name);load();
}
async function answer(id,ok){
 const c=chs.find(x=>x.id===id);
 const {error}=await sb.from('challenges').update({status:ok?'accepted':'rejected',responded_at:new Date().toISOString()}).eq('id',id).eq('status','pending');
 if(error)return alert(error.message);
 if(ok){const mine=c.from_team===c.home_team?c.away_team:c.home_team,base={battle_id:B.id,challenge_id:id,game_id:c.game_id,game_date:c.game_date,amount:c.amount};
  const r=await sb.from('bets').insert([{...base,player_id:c.from_player,team:c.from_team},{...base,player_id:me.id,team:mine}]);
  if(r.error)return alert(r.error.message);}
 load();
}
function cp(t){navigator.clipboard.writeText(t).then(()=>alert('Copied'))}

// ---------- awards ----------
let nbaS='idle',nbaN=0;
const canPick=()=>{const y=parseInt(String(B.season).slice(0,4));return isNaN(y)?true:Date.now()<new Date(y,11,1).getTime()};
const canDeclare=()=>{const y=parseInt(String(B.season).slice(0,4));return isNaN(y)?false:Date.now()>=new Date(y+1,4,15).getTime()};
async function loadNBA(){
 if(NBA.length)return;
 try{const c=JSON.parse(localStorage.bd_nba||'null');if(c&&Date.now()-c.t<6048e5&&c.list.length){NBA=c.list;return}}catch(e){}
 nbaS='loading';nbaN=0;updRes();
 const base='https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams',ids=[];
 try{const t=await fetch(base).then(r=>r.json());t.sports[0].leagues[0].teams.forEach(x=>ids.push(String(x.team.id)))}catch(e){}
 if(!ids.length)for(let i=1;i<=30;i++)ids.push(String(i));
 const M=new Map();
 await Promise.allSettled(ids.map(id=>fetch(base+'/'+id+'/roster').then(r=>r.json()).then(r=>{
  const ab=r.team&&r.team.abbreviation;
  (r.athletes||[]).forEach(a=>{if(a&&a.id)M.set(String(a.id),{id:String(a.id),name:a.displayName||a.fullName,team:ab,pos:a.position&&a.position.abbreviation,rookie:!!(a.experience&&a.experience.years===0)})});
 }).finally(()=>{nbaN++;updRes()})));
 NBA=[...M.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
 nbaS=NBA.length?'ok':'err';
 if(NBA.length)try{localStorage.bd_nba=JSON.stringify({t:Date.now(),list:NBA})}catch(e){}
}
function openAw(k){if(!canPick())return alert('Closed na ang picks (cutoff Dec 1)');aw=k;am='pick';aq='';view();loadNBA().then(updRes);setTimeout(()=>{const i=$('#aq');i&&i.focus()},50)}
function updRes(){
 const el=$('#awres');if(!el)return;
 if(!NBA.length){el.innerHTML=nbaS==='err'?'<div class="mut">Hindi ma-load ang players.</div><button class="btn" style="width:100%;background:#262b35;color:#e9ecf1;margin-top:6px" onclick="loadNBA().then(updRes)">Retry</button>':`<div class="mut">Loading players... ${nbaN}/30</div>`;return}
 const q=aq.toLowerCase();let L=NBA;
 if(aw==='roy'){const r=L.filter(x=>x.rookie);L=r.length?r:L}
 L=L.filter(x=>x.name.toLowerCase().includes(q)).slice(0,8);
 const taken=am==='pick'?dr[aw].map(d=>d.id).concat(picks.filter(p=>p.award===aw&&p.player_id===me.id).map(p=>p.nba_player_id)):[];
 el.innerHTML=L.map(x=>{const t=taken.includes(x.id);return`<button class="row" style="border:0;color:#e9ecf1;text-align:left;cursor:pointer;min-height:44px;width:100%;${t?'opacity:.4':''}" ${t?'disabled':''} onclick="pickRes('${x.id}')"><span style="font-weight:600">${esc(x.name)}</span><span class="mut">${esc(x.team||'')}${x.pos?' · '+esc(x.pos):''}</span></button>`}).join('')||'<div class="mut">No match</div>';
}
function openWin(k){if(!canDeclare())return alert('Locked hanggang May 15');aw=k;am='win';aq='';view();loadNBA().then(updRes);setTimeout(()=>{const i=$('#aq');i&&i.focus()},50)}
function pickRes(id){am==='win'?declare(id):addDraft(id)}
async function addDraft(id){
 if(!canPick())return alert('Closed na ang picks (cutoff Dec 1)');
 const x=NBA.find(y=>y.id===id),k=aw,d=dr[k],lbl=k==='mvp'?'MVP':'Rookie of the Year';
 const mineP=picks.filter(p=>p.award===k&&p.player_id===me.id);
 if(mineP.length){
  if(results.find(r=>r.award===k))return alert('Winner already declared');
  if(mineP.length>=3)return alert('Max 3 picks');
  if(!confirm('Add '+x.name+' as another '+lbl+' pick? Final na, hindi na mababago.'))return;
  const {error}=await sb.from('award_picks').insert({battle_id:B.id,player_id:me.id,award:k,nba_player_id:x.id,nba_player_name:x.name});
  if(error)return alert(error.message);
  aw=null;load();return;
 }
 if(d.length>=3)return alert('Max 3 picks');
 if(!d.some(y=>y.id===id))d.push({id:x.id,name:x.name});
 aw=null;view();
}
function rmDraft(k,id){dr[k]=dr[k].filter(x=>x.id!==id);view()}
async function lockAw(k){
 if(!canPick())return alert('Closed na ang picks (cutoff Dec 1)');
 const lbl=k==='mvp'?'MVP':'Rookie of the Year',os=opp&&stakes.find(x=>x.award===k&&x.player_id===opp.id),amt=os?Number(os.amount):Number(damt[k]),d=dr[k];
 if(!d.length)return alert('Add at least 1 player');if(!(amt>0))return alert('Enter an amount');
 if(!confirm('Lock '+d.map(x=>x.name).join(', ')+' for '+lbl+' with '+peso(amt)+'? Final na, hindi na mababago.'))return;
 const s=await sb.from('award_stakes').insert({battle_id:B.id,player_id:me.id,award:k,amount:amt}).select().single();
 if(s.error)return alert(s.error.message);
 const r=await sb.from('award_picks').insert(d.map(x=>({battle_id:B.id,player_id:me.id,award:k,nba_player_id:x.id,nba_player_name:x.name})));
 if(r.error){await sb.from('award_stakes').delete().eq('id',s.data.id);return alert(r.error.message)}
 dr[k]=[];load();
}
async function declare(id){
 if(!canDeclare())return alert('Locked hanggang May 15');
 const x=NBA.find(y=>y.id===id),k=aw,lbl=k==='mvp'?'MVP':'Rookie of the Year';
 if(!confirm('Declare '+x.name+' as the '+lbl+' winner? Final na ito para sa dalawa.'))return;
 const ids=pid=>picks.filter(p=>p.award===k&&p.player_id===pid).map(p=>p.nba_player_id);
 const ms=stakes.find(s=>s.award===k&&s.player_id===me.id),os=opp&&stakes.find(s=>s.award===k&&s.player_id===opp.id);
 const amt=ms&&os?Math.min(Number(ms.amount),Number(os.amount)):0;
 const mh=ids(me.id).includes(id),oh=opp?ids(opp.id).includes(id):false,tabla=!amt||mh===oh;
 const r=await sb.from('award_results').insert({battle_id:B.id,award:k,nba_player_id:x.id,nba_player_name:x.name,declared_by:me.id});
 if(r.error)return alert(r.error.code==='23505'?'Winner already declared':r.error.message);
 const rows=[{battle_id:B.id,award:k,player_id:me.id,result:tabla?'tabla':mh?'won':'lost',profit:tabla?0:mh?amt:-amt}];
 if(opp)rows.push({battle_id:B.id,award:k,player_id:opp.id,result:tabla?'tabla':oh?'won':'lost',profit:tabla?0:oh?amt:-amt});
 const p=await sb.from('award_payouts').insert(rows);if(p.error)alert(p.error.message);
 aw=null;load();
}

// ---------- view ----------
function stat(pid,p){
 const n=new Date();let f=null;
 if(p==='week'){f=new Date(n);f.setHours(0,0,0,0);f.setDate(f.getDate()-((f.getDay()+6)%7))}
 else if(p==='month')f=new Date(n.getFullYear(),n.getMonth(),1);else if(p==='year')f=new Date(n.getFullYear(),0,1);
 const b=bets.filter(x=>x.player_id===pid&&(x.status==='won'||x.status==='lost')&&(!f||new Date(x.game_date)>=f));
 const inc=b.filter(x=>x.status==='won').reduce((s,x)=>s+Number(x.amount),0),lost=b.filter(x=>x.status==='lost').reduce((s,x)=>s+Number(x.amount),0);
 const pp=pays.filter(x=>x.player_id===pid&&(!f||new Date(x.created_at)>=f)),pi=pp.filter(x=>Number(x.profit)>0).reduce((a,x)=>a+Number(x.profit),0),pl=pp.filter(x=>Number(x.profit)<0).reduce((a,x)=>a-Number(x.profit),0);
 return{w:b.filter(x=>x.status==='won').length,l:b.filter(x=>x.status==='lost').length,inc:inc+pi,lost:lost+pl,net:inc+pi-lost-pl,stake:inc+lost+pi+pl};
}
function view(){
 if(!me)return;
 const f=document.activeElement&&document.activeElement.id==='aq';
 const inbox=chs.filter(c=>c.to_player===me.id&&c.status==='pending'),out=chs.filter(c=>c.from_player===me.id&&c.status==='pending');
 const nm=opp?opp.name:'Player 2',sm=stat(me.id,'career'),so=opp?stat(opp.id,'career'):{net:0},S=sm.stake||0;
 const pm=S?Math.round(50+50*sm.net/S):50,lead=Math.abs(sm.net);
 const rec=p=>{if(!p)return'';const s=stat(p.id,per);return`<div style="background:#0f1115;border-radius:10px;padding:10px"><div style="font-size:13px;color:${col(p)}">${esc(p.name)}</div><div class="num" style="font-size:26px">${s.w}W – ${s.l}L</div><div class="mut" style="margin-top:6px">Income <span class="g">${peso(s.inc)}</span></div><div class="mut">Lost <span class="r">${peso(s.lost)}</span></div></div>`};
 const nets=n=>`<span class="${n>=0?'g':'r'}">${n>=0?'+':''}${peso(n)}</span>`;

function playFx(id){
 const f=FX.find(x=>x.id===id);if(!f)return;

 o.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer';
 const T="font-family:'Barlow Condensed',sans-serif;font-weight:700;text-shadow:0 0 24px #000;";
 let h='';
 if(f.t==='rain'||f.t==='rise')for(let i=0;i<36;i++)h+=`<span style="position:absolute;left:${Math.random()*95}vw;top:0;font-size:${24+Math.random()*28}px;animation:${f.t==='rain'?'fxfall':'fxrise'} ${2+Math.random()*2.5}s linear ${Math.random()*1.5}s both">${f.em[i%f.em.length]}</span>`;
 if(f.t==='stamp')h+=`<div style="${T}font-size:${f.txt.length>2?30:55}vw;line-height:1;color:#e5484d;animation:fxstamp .7s ease-out both">${f.txt}</div>`;
 else if(f.t==='banner')h+=`<div style="${T}position:absolute;white-space:nowrap;font-size:18vw;color:#fff;animation:fxslide 3s linear both">${f.txt}</div>`;
 else h+=`<div style="${T}position:relative;font-size:16vw;color:#fff;text-align:center;animation:fxpop .6s ease-out both">${f.txt}</div>`;
 h+='<div style="position:absolute;bottom:18px;font-size:12px;color:#ccc">tap to close</div>';

 setTimeout(()=>o.remove(),4500);
}
