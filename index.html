<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bet Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#e9ecf1;font-family:'Barlow',sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:#181b22;border:1px solid #262b35;border-radius:14px;padding:14px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8b93a1;margin:0 0 10px}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.btn{border:0;border-radius:10px;height:44px;font:600 14px 'Barlow',sans-serif;cursor:pointer;padding:0 14px}
.tab{flex:none;min-width:64px;height:44px;padding:0 12px;border-radius:10px;border:1px solid #262b35;background:transparent;color:#8b93a1;font:600 13px 'Barlow',sans-serif;cursor:pointer}
.tab.on{border-color:#ff7a2f;background:#2a1a10;color:#ff9a5c}
input{width:100%;height:46px;border-radius:10px;border:1px solid #262b35;background:#0f1115;color:#e9ecf1;padding:0 12px;font:500 16px 'Barlow',sans-serif;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;background:#0f1115;border-radius:10px;padding:10px;gap:8px}
.mut{font-size:12px;color:#8b93a1}.g{color:#4cc38a}.r{color:#ff6b70}
</style></head><body><div id="app"></div>
<script>
// ====== CONFIG: ilagay dito ang Supabase URL at anon key ======
const SUPABASE_URL='https://estsyaueypsufuzsetib.supabase.co';
const SUPABASE_KEY='sb_publishable_jq6skZVY4fik2Hdxm4CNpQ_QJRkaXB0';
// ==============================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), A=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const peso=n=>(n<0?'-':'')+'₱'+Math.abs(n).toLocaleString('en-PH');
const gen=n=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint8Array(n);crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join('')};
const fmt=c=>c.replace(/(.{4})(?=.)/g,'$1-');
let me,opp,B,bets=[],chs=[],games=[],day=0,sel=null,per='week',subbed=false;
const col=p=>p&&p.color==='blue'?'#6db8ff':'#ff9a5c';
const dkey=i=>{const d=new Date();d.setDate(d.getDate()+i);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
const dlbl=i=>{if(!i)return'Today';const d=new Date();d.setDate(d.getDate()+i);return d.toLocaleDateString('en-PH',{month:'short',day:'numeric'})};

// ---------- onboarding ----------
function welcome(){
 const j=new URLSearchParams(location.search).get('join');
 A.innerHTML=`<div class="num" style="font-size:32px;letter-spacing:.04em">BET DUEL</div>`+
 (j?`<div class="card"><p class="lbl">Join battle</p><input id="pn" placeholder="Your name"><button class="btn" style="width:100%;background:#3aa0ff;color:#001a33" onclick="joinB('${esc(j)}')">Join battle</button></div>`
 :`<div class="card"><p class="lbl">Create battle</p><input id="pn" placeholder="Your name"><input id="bn" placeholder="Battle name (e.g. Barkada Cup)"><input id="se" value="2026-27"><button class="btn" style="width:100%;background:#ff7a2f;color:#1a0b00" onclick="createB()">Create &amp; get invite link</button></div>`)+
 `<div class="card"><p class="lbl">Have a sync code?</p><input id="sc" placeholder="XXXX-XXXX-XXXX"><button class="btn" style="width:100%;background:#262b35;color:#e9ecf1" onclick="useCode()">Restore</button></div>`;
}
async function createB(){
 const n=$('#pn').value.trim(),bn=$('#bn').value.trim(),se=$('#se').value.trim();
 if(!n||!bn||!se)return alert('Fill in all fields');
 const {data:b,error}=await sb.from('battles').insert({name:bn,season:se,invite_code:gen(6)}).select().single();
 if(error)return alert(error.message);
 const {data:p,error:e2}=await sb.from('players').insert({battle_id:b.id,slot:1,name:n,color:'orange',sync_code:gen(12)}).select().single();
 if(e2)return alert(e2.message);
 localStorage.bd_sync=p.sync_code;await boot();alert('Save your sync code (see bottom of page) and send the invite link to Player 2.');
}
async function joinB(code){
 const n=$('#pn').value.trim();if(!n)return alert('Enter your name');
 const {data:b}=await sb.from('battles').select('*').eq('invite_code',code.toUpperCase()).maybeSingle();
 if(!b)return alert('Invalid invite link');
 const {data:ps}=await sb.from('players').select('id').eq('battle_id',b.id);
 if(ps.length>=2)return alert('This battle already has 2 players');
 const {data:p,error}=await sb.from('players').insert({battle_id:b.id,slot:2,name:n,color:'blue',sync_code:gen(12)}).select().single();
 if(error)return alert(error.message);
 localStorage.bd_sync=p.sync_code;history.replaceState(null,'',location.pathname);await boot();
}
async function useCode(){localStorage.bd_sync=$('#sc').value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();await boot()}

// ---------- data ----------
async function boot(){
 const sc=localStorage.bd_sync;if(!sc)return welcome();
 const {data:p}=await sb.from('players').select('*').eq('sync_code',sc).maybeSingle();
 if(!p){localStorage.removeItem('bd_sync');alert('Sync code not found');return welcome()}
 me=p;
 const {data:b}=await sb.from('battles').select('*').eq('id',p.battle_id).single();B=b;
 await load();await loadGames();
 if(!subbed){subbed=true;
  ['challenges','bets'].forEach(t=>sb.channel('bd_'+t).on('postgres_changes',{event:'*',schema:'public',table:t,filter:'battle_id=eq.'+B.id},()=>load()).subscribe());
  setInterval(settle,60000);setInterval(loadGames,60000);
 }
 settle();
}
async function load(){
 const {data:ps}=await sb.from('players').select('*').eq('battle_id',B.id);
 opp=ps.find(x=>x.id!==me.id);
 const [b,c]=await Promise.all([sb.from('bets').select('*').eq('battle_id',B.id),sb.from('challenges').select('*').eq('battle_id',B.id).order('created_at',{ascending:false})]);
 bets=b.data||[];chs=c.data||[];view();
}
async function loadGames(){
 try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates='+dkey(day)).then(r=>r.json());
 games=(r.events||[]).map(e=>{const c=e.competitions[0].competitors,h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');
  return{id:e.id,date:e.date,state:e.status.type.state,detail:e.status.type.shortDetail,h:h.team.abbreviation,a:a.team.abbreviation,hs:h.score,as:a.score}});
 }catch(e){games=[]}
 view();
}
async function settle(){
 const open=bets.filter(b=>b.status==='open');
 for(const id of [...new Set(open.map(b=>b.game_id))]){
  try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event='+id).then(r=>r.json());
   const c=r.header.competitions[0];if(!c.status.type.completed)continue;
   const w=c.competitors.find(x=>x.winner);if(!w)continue;
   for(const b of open.filter(x=>x.game_id===id)){const won=b.team===w.team.abbreviation;
    await sb.from('bets').update({status:won?'won':'lost',profit:won?b.amount:-b.amount,settled_at:new Date().toISOString()}).eq('id',b.id).eq('status','open');}
  }catch(e){}
 }
 if(open.length)load();
}

// ---------- actions ----------
function pick(id){sel=sel&&sel.id===id?null:{id,team:null,amt:500};view()}
function setTeam(t){sel.team=t;view()}
function setAmt(n){sel.amt=n;view()}
async function send(){
 const g=games.find(x=>x.id===sel.id),amt=Number($('#amt').value);
 if(!opp)return alert('Wait for Player 2 to join first');
 if(!sel.team)return alert('Select a team');if(!(amt>0))return alert('Enter an amount');
 const {error}=await sb.from('challenges').insert({battle_id:B.id,game_id:g.id,game_date:g.date,home_team:g.h,away_team:g.a,from_player:me.id,to_player:opp.id,from_team:sel.team,amount:amt});
 if(error)return alert(error.message);
 sel=null;alert('Request sent to '+opp.name);load();
}
async function answer(id,ok){
 const c=chs.find(x=>x.id===id);
 const {error}=await sb.from('challenges').update({status:ok?'accepted':'rejected',responded_at:new Date().toISOString()}).eq('id',id).eq('status','pending');
 if(error)return alert(error.message);
 if(ok){const mine=c.from_team===c.home_team?c.away_team:c.home_team,base={battle_id:B.id,challenge_id:id,game_id:c.game_id,game_date:c.game_date,amount:c.amount};
  const r=await sb.from('bets').insert([{...base,player_id:c.from_player,team:c.from_team},{...base,player_id:me.id,team:mine}]);
  if(r.error)return alert(r.error.message);}
 load();
}
function cp(t){navigator.clipboard.writeText(t).then(()=>alert('Copied'))}

// ---------- view ----------
function stat(pid,p){
 const n=new Date();let f=null;
 if(p==='week'){f=new Date(n);f.setHours(0,0,0,0);f.setDate(f.getDate()-((f.getDay()+6)%7))}
 else if(p==='month')f=new Date(n.getFullYear(),n.getMonth(),1);else if(p==='year')f=new Date(n.getFullYear(),0,1);
 const b=bets.filter(x=>x.player_id===pid&&(x.status==='won'||x.status==='lost')&&(!f||new Date(x.game_date)>=f));
 const inc=b.filter(x=>x.status==='won').reduce((s,x)=>s+Number(x.amount),0),lost=b.filter(x=>x.status==='lost').reduce((s,x)=>s+Number(x.amount),0);
 return{w:b.filter(x=>x.status==='won').length,l:b.filter(x=>x.status==='lost').length,inc,lost,net:inc-lost,stake:inc+lost};
}
function view(){
 if(!me)return;
 const inbox=chs.filter(c=>c.to_player===me.id&&c.status==='pending'),out=chs.filter(c=>c.from_player===me.id&&c.status==='pending');
 const nm=opp?opp.name:'Player 2',sm=stat(me.id,'career'),so=opp?stat(opp.id,'career'):{net:0},S=sm.stake||0;
 const pm=S?Math.round(50+50*sm.net/S):50,lead=Math.abs(sm.net);
 const rec=p=>{if(!p)return'';const s=stat(p.id,per);return`<div style="background:#0f1115;border-radius:10px;padding:10px"><div style="font-size:13px;color:${col(p)}">${esc(p.name)}</div><div class="num" style="font-size:26px">${s.w}W – ${s.l}L</div><div class="mut" style="margin-top:6px">Income <span class="g">${peso(s.inc)}</span></div><div class="mut">Lost <span class="r">${peso(s.lost)}</span></div></div>`};
 const nets=n=>`<span class="${n>=0?'g':'r'}">${n>=0?'+':''}${peso(n)}</span>`;
 const sched=games.length?games.map(g=>{
  const live=g.state==='in',post=g.state==='post',t=new Date(g.date).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
  const sub=post?`Final · ${g.a} ${g.as} – ${g.h} ${g.hs}`:live?`<span class="r">Live · ${esc(g.detail)}</span> · ${g.a} ${g.as} – ${g.h} ${g.hs}`:t;
  const open=sel&&sel.id===g.id;
  return open?`<div style="background:#0f1115;border:1px solid #ff7a2f;border-radius:10px;padding:12px">
   <div style="font-weight:600;margin-bottom:10px">${g.a} @ ${g.h} <span class="mut">${sub}</span></div>
   <p class="lbl" style="margin-bottom:6px">Select team</p><div style="display:flex;gap:8px;margin-bottom:12px">${[g.a,g.h].map(t=>`<button class="tab ${sel.team===t?'on':''}" style="flex:1" onclick="setTeam('${t}')">${t}</button>`).join('')}</div>
   <p class="lbl" style="margin-bottom:6px">Amount</p><input id="amt" type="number" inputmode="numeric" value="${sel.amt}" oninput="sel.amt=this.value">
   <div style="display:flex;gap:8px;margin-bottom:12px">${[100,500,1000].map(n=>`<button class="tab" style="flex:1" onclick="setAmt(${n})">₱${n.toLocaleString()}</button>`).join('')}</div>
   <button class="btn" style="width:100%;background:#ff7a2f;color:#1a0b00;margin-bottom:8px" onclick="send()">Send request to ${esc(nm)}</button>
   <button class="btn" style="width:100%;background:transparent;color:#8b93a1" onclick="pick('${g.id}')">Cancel</button></div>`
  :`<div class="row"><div><div style="font-size:14px;font-weight:600">${g.a} @ ${g.h}</div><div class="mut">${sub}</div></div>${post?'':`<button class="btn" style="width:96px;background:#4cc38a;color:#06210f" onclick="pick('${g.id}')">Pick</button>`}</div>`
 }).join(''):'<div class="mut">No games on this date.</div>';
 A.innerHTML=`
 <div style="display:flex;justify-content:space-between;align-items:center"><div><div class="num" style="font-size:28px;letter-spacing:.04em">BET DUEL</div><div class="mut">Season ${esc(B.season)} · ${esc(B.name)}</div></div>
 <button aria-label="Notifications" onclick="document.getElementById('inbox')&&document.getElementById('inbox').scrollIntoView({behavior:'smooth'})" style="position:relative;width:44px;height:44px;border-radius:12px;border:1px solid #262b35;background:#181b22;color:#e9ecf1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>${inbox.length?`<span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#e5484d;color:#fff;font:600 12px 'Barlow';display:flex;align-items:center;justify-content:center">${inbox.length}</span>`:''}</button></div>
 ${opp?'':`<div class="card" style="border-color:#3aa0ff"><p class="lbl">Waiting for Player 2</p><div class="mut" style="margin-bottom:10px">Send them the invite link:</div><button class="btn" style="width:100%;background:#3aa0ff;color:#001a33" onclick="cp(location.origin+location.pathname+'?join=${B.invite_code}')">Copy invite link</button></div>`}
 <div class="card"><p class="lbl">Duel · Net profit</p><div style="display:flex;justify-content:space-between;align-items:flex-end">
  <div><div style="font-size:13px;color:${col(me)}">${esc(me.name)}</div><div class="num" style="font-size:30px">${nets(sm.net)}</div></div>
  <div style="text-align:right"><div style="font-size:13px;color:${col(opp)}">${esc(nm)}</div><div class="num" style="font-size:30px">${nets(so.net)}</div></div></div>
  <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:10px;background:#262b35"><div style="width:${pm}%;background:#ff7a2f"></div><div style="width:${100-pm}%;background:#3aa0ff"></div></div>
  <div style="display:flex;justify-content:space-between" class="mut"><span>${pm}%</span><span>${lead?'Lamang ng '+peso(lead):'Tabla pa'}</span><span>${100-pm}%</span></div></div>
 <div class="card"><div style="display:flex;gap:4px;background:#0f1115;border-radius:12px;padding:3px;margin-bottom:12px">${[['week','Week'],['month','Month'],['year','Year'],['career','Career']].map(([k,l])=>`<button class="tab ${per===k?'on':''}" style="flex:1;border:0" onclick="per='${k}';view()">${l}</button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${rec(me)}${rec(opp)}</div></div>
 ${inbox.length?`<div id="inbox" class="card" style="border-color:#ff7a2f"><p class="lbl" style="color:#ff9a5c">Challenge request${inbox.length>1?'s':''}</p>${inbox.map(c=>`<div style="margin-bottom:12px"><div style="font-size:15px;font-weight:600">${esc(nm)} wants ${c.from_team} (${c.away_team} @ ${c.home_team})</div><div class="mut" style="margin:2px 0 10px">Stake ${peso(Number(c.amount))} · you get ${c.from_team===c.home_team?c.away_team:c.home_team}</div><div style="display:flex;gap:10px"><button class="btn" style="flex:1;background:#4cc38a;color:#06210f" onclick="answer('${c.id}',true)">Accept</button><button class="btn" style="flex:1;background:#e5484d;color:#fff" onclick="answer('${c.id}',false)">Reject</button></div></div>`).join('')}</div>`:''}
 <div class="card"><p class="lbl">NBA games · Schedule</p><div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:12px">${[0,1,2,3,4,5,6].map(i=>`<button class="tab ${day===i?'on':''}" onclick="day=${i};sel=null;loadGames()">${dlbl(i)}</button>`).join('')}</div>
  ${out.length?`<div class="mut" style="margin-bottom:10px">${out.length} request${out.length>1?'s':''} waiting for ${esc(nm)}</div>`:''}
  <div style="display:flex;flex-direction:column;gap:10px">${sched}</div></div>
 <div class="card"><p class="lbl">My sync code</p><div class="num" style="font-size:26px;letter-spacing:.06em">${fmt(me.sync_code)}</div><div class="mut" style="margin:6px 0 10px">Ilagay ito sa "Have a sync code?" sa bagong device.</div>
  <div style="display:flex;gap:10px"><button class="btn" style="flex:1;background:#262b35;color:#e9ecf1" onclick="cp('${me.sync_code}')">Copy code</button>${me.slot===1?`<button class="btn" style="flex:1;background:#262b35;color:#e9ecf1" onclick="cp(location.origin+location.pathname+'?join=${B.invite_code}')">Copy invite link</button>`:''}</div></div>`;
}
boot();
</script></body></html>
